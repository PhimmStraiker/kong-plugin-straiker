services:
  kong:
    image: kong/kong-gateway:3.14
    container_name: straiker-coding-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PLUGINS: "bundled,straiker-coding"
      # dedup state for the agentic loop (transcript resent every request)
      KONG_NGINX_HTTP_LUA_SHARED_DICT: "straiker_coding 32m"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: "notice"
      KONG_NGINX_WORKER_PROCESSES: "2"
      # buffered proxy needs a generous client body buffer for 138KB CC requests
      KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE: "16m"
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: "0"
    volumes:
      - ../../kong/plugins/straiker-coding:/usr/local/share/lua/5.1/kong/plugins/straiker-coding:ro
      - ../../kong/plugins/straiker-shared:/usr/local/share/lua/5.1/kong/plugins/straiker-shared:ro
      - ./out/kong.rendered.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
